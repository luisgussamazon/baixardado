<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FANS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f7;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #0052cc;
            font-size: 38px;
        }

        .logo p {
            color: #667085;
            margin-top: 8px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #344054;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #0052cc;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0052cc;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #003d99;
        }

        #mensagem {
            min-height: 24px;
            margin-top: 16px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">
            <h1>FANS</h1>
            <p>Mural interno de comunicação</p>
        </div>

        <form id="formLogin">

            <label for="login">Login</label>
            <input
                type="text"
                id="login"
                placeholder="Digite seu login"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <label for="perfil">Perfil</label>
            <select id="perfil" required>
                <option value="">Selecione</option>
                <option value="aa">AA</option>
                <option value="admin">Administrador</option>
            </select>

            <button type="submit">Entrar</button>

            <p id="mensagem"></p>

        </form>

    </main>

    <script>
        const formulario = document.getElementById("formLogin");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();

            const login = document.getElementById("login").value.trim();
            const senha = document.getElementById("senha").value;
            const perfil = document.getElementById("perfil").value;

            if (!login || !senha || !perfil) {
                mensagem.textContent = "Preencha todos os campos.";
                mensagem.style.color = "#d92d20";
                return;
            }

            localStorage.setItem("fansLogin", login);
            localStorage.setItem("fansPerfil", perfil);

            mensagem.textContent = "Login realizado com sucesso.";
            mensagem.style.color = "#039855";

            setTimeout(function () {
                if (perfil === "admin") {
                    window.location.href = "../admin/page.html";
                } else {
                    window.location.href = "../avisos/page.html";
                }
            }, 700);
        });
    </script>

</body>
</html>
