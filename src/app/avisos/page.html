<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FANS | Avisos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f2f4f8;
}

header{
background:#0052cc;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:28px;
}

header button{
padding:10px 20px;
border:none;
border-radius:8px;
background:white;
color:#0052cc;
cursor:pointer;
font-weight:bold;
}

.container{
max-width:900px;
margin:30px auto;
padding:20px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
margin-bottom:25px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card img{
width:100%;
}

.conteudo{
padding:20px;
}

.titulo{
font-size:24px;
font-weight:bold;
margin-bottom:10px;
color:#003366;
}

.data{
color:gray;
margin-bottom:15px;
}

button.lido{
margin-top:20px;
background:#28a745;
color:white;
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
}

.vazio{

text-align:center;
margin-top:100px;
font-size:22px;
color:gray;

}

</style>

</head>

<body>

<header>

<h1>FANS</h1>

<button onclick="logout()">

Sair

</button>

</header>

<div class="container" id="lista"></div>

<script>

if(localStorage.getItem("fansPerfil")!="aa"){

location.href="../login/page.html";

}

const avisos=JSON.parse(localStorage.getItem("fansAvisos"))||[];

const lista=document.getElementById("lista");

if(avisos.length==0){

lista.innerHTML='<div class="vazio">Nenhum comunicado publicado.</div>';

}

avisos.forEach(aviso=>{

lista.innerHTML+=`

<div class="card">

${aviso.imagem?`<img src="${aviso.imagem}">`:""}

<div class="conteudo">

<div class="titulo">

${aviso.titulo}

</div>

<div class="data">

${aviso.data}

</div>

<p>

${aviso.mensagem}

</p>

<button class="lido" onclick="confirmar(this)">

Li e estou ciente

</button>

</div>

</div>

`;

});

function confirmar(botao){

botao.innerHTML="✔ Confirmado";

botao.style.background="#666";

botao.disabled=true;

}

function logout(){

localStorage.removeItem("fansPerfil");
localStorage.removeItem("fansLogin");

location.href="../login/page.html";

}

</script>

</body>
</html>
